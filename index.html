<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // Theme before the first paint: a host-set data-theme (claude.ai) wins; otherwise the saved choice, or the OS setting for "System".
      (function () {
        var r = document.documentElement;
        if (r.hasAttribute('data-theme')) return;
        var t = 'system';
        try { t = localStorage.getItem('ylb-theme') || 'system'; } catch (e) {}
        var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
        var apply = function () { r.setAttribute('data-theme', t === 'light' || t === 'dark' ? t : mq && mq.matches ? 'dark' : 'light'); };
        apply();
        r.setAttribute('data-theme-source', 'app');
        if (t === 'system' && mq && mq.addEventListener) mq.addEventListener('change', apply);
      })();
    </script>
    <meta name="theme-color" content="#F3F3F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050506" media="(prefers-color-scheme: dark)" />
    <title>Yourlocalbusiness</title>
